name: release-java-central

# Canonical five-job Maven Central publish workflow for the promptLM org.
# Topology: validate-inputs -> verify -> smoke-sign -> deploy -> promote.
# Other Java repos call this via `uses:` with `secrets: inherit`.
#
# Required secrets (this repo, or inherited from the caller):
#   MAVEN_GPG_PRIVATE_KEY  armored private key (imported by setup-java)
#   MAVEN_GPG_PASSPHRASE   passphrase for that key
#   CENTRAL_USERNAME       Central Portal user token name
#   CENTRAL_PASSWORD       Central Portal user token secret
# The `maven-central-publish` environment must exist with required reviewers.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must already be set in the poms)'
        required: true
        type: string
      dry-run:
        description: 'Build and sign but do not deploy or promote'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry-run:
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"
          else
            V="${{ inputs.version }}"
          fi
          [ -n "$V" ] || { echo "::error::No version resolved"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"
      - name: Validate semver, reject SNAPSHOT
        run: |
          V="${{ steps.resolve.outputs.version }}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Not a semver version: $V"; exit 1; }
          case "$V" in *SNAPSHOT*) echo "::error::Refusing to publish a SNAPSHOT"; exit 1;; esac
      - name: Idempotency check (already on Central?)
        run: |
          V="${{ steps.resolve.outputs.version }}"
          URL="https://repo1.maven.org/maven2/dev/promptlm/promptlm-parent/$V/promptlm-parent-$V.pom"
          if curl -sfI "$URL" >/dev/null 2>&1; then
            echo "::error::dev.promptlm:promptlm-parent:$V is already on Central"; exit 1
          fi
          echo "Not yet on Central — OK to proceed."

  verify:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (no signing)
        run: mvn -B -ntp verify

  smoke-sign:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Smoke-test the signing key
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          echo "promptlm release smoke test" > smoke.txt
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$MAVEN_GPG_PASSPHRASE" \
            --detach-sign --armor smoke.txt
          gpg --verify smoke.txt.asc smoke.txt
          echo "GPG signing verified."

  deploy:
    needs: [validate-inputs, smoke-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      deployment_id: ${{ steps.mvn-deploy.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Central Portal (upload + validate)
        id: mvn-deploy
        if: ${{ !inputs.dry-run }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -o pipefail
          mvn -B -ntp -Prelease -DskipTests deploy | tee deploy.log
          # The plugin prints `deploymentId: <uuid>` only to stdout — tee + grep it out.
          ID=$(grep -oiP 'deploymentId:\s*\K[0-9a-f-]+' deploy.log | head -1)
          [ -n "$ID" ] || { echo "::error::deploymentId not found in deploy output"; exit 1; }
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Captured deploymentId: $ID"
      - name: Dry-run build + sign (no deploy)
        if: ${{ inputs.dry-run }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests verify
      - name: Attest build provenance
        if: ${{ !inputs.dry-run && hashFiles('**/target/*.jar') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '**/target/*.jar'

  promote:
    needs: [validate-inputs, deploy]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: maven-central-publish
    steps:
      - name: Promote deployment (irreversible)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
        run: |
          [ -n "$DEPLOYMENT_ID" ] || { echo "::error::No deployment_id from deploy job"; exit 1; }
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          echo "Publishing deployment $DEPLOYMENT_ID ..."
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $AUTH" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID")
          echo "Central API responded HTTP $code"
          case "$code" in
            2*) echo "Deployment promoted to PUBLISHING/PUBLISHED.";;
            *)  echo "::error::Promote failed (HTTP $code)"; exit 1;;
          esac
