name: oss-checks

# Thin caller of the org-wide reusable workflow at
# promptLM/.github/.github/workflows/oss-checks.yml. Keeping the gitleaks
# install + license-eye plumbing in the org repo means a CLI version bump
# (or a tooling swap) is one org PR rather than a per-repo sweep.
#
# License-header check is ON: .licenserc.yaml at the repo root pins the
# Apache-2.0 header pattern. With no .java files in the reactor today (this
# repo is the BOM + parent POM only), license-eye is effectively a no-op
# until source modules land — but the wiring stays correct.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run:
    uses: promptLM/.github/.github/workflows/oss-checks.yml@main
    with:
      check-license-headers: true
